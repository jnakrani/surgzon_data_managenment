7. Field-Specific Rules: (Columns)
    Length: (e.g.(6.7 X 95MM)) assume the first value is diameter and the second is length.

    Diameter: (e.g.(6.7 X 95MM)) assume the first value is diameter and the second is length.

    Height: If the prefix includes + with MM or postfix includes STEP, it should be included in height.

    Thickness: use the format +(number).

    Coated:
        CTD → Coated
        CAP CTD / COATED → Cap Coated

    Constrained:
        CONST → Yes

    Material:
        TI / TITANIUM → Titanium
        SS → Stainless Steel

    Cannulated:
        CANN → Cannulated / Yes
    
    Cancellous:
        CANC → Cancellous
        CORTICAL → Cortical
        CORTEX / NEAR CORTEX → Cortex

    Thread:
        PT THD → Partially Threaded
        FULLY THRDED → Fully Threaded
    
    Locking:
        Lock: yes

    Size:
        6H → 6-Hole
        10 HOLE → 10-Hole
        L/XL → Large–X-Large
        S/M → Small–Medium
        STD → Standard
        LNG → Long
        SIZE 14 → Size 14

    Compression:
        DBL → Double

    Shape:
        SQUARE → Square
        STR → Straight
        HEXALOBE → Hexalobe
        A/P SLPD → Antero-Posterior Sloped Wedge
        META OPEN WDG → Metatarsal Opening Wedge
        NAR → Narrow
        WIDE → Wide
        CONTRD → Contoured
        10MM WEDGE → 10 mm Wedge

    Loop:
        LOOP → Extract numeric values (e.g., 40, 35, 30)

    Bone:
        HUMERAL → Humerus
        TIBIAL → Tibia
        FEMORAL → Femur
        RADIUS → Radius

    Side:
        RT → Right
        LT → Left

    Angle:
        Values like 14°, 15° etc. → Angle

    Position:
        INF → Inferior

    offset: use the format +(number)MM

    Sterile:
        STERILE → Yes / No

